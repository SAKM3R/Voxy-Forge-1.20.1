name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'screenshots/**']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew build --console=plain --stacktrace 2>&1 | tee build.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Boots the game on a software (Mesa llvmpipe) GPU, creates a world and checks that Voxy starts and
      # that every mixin applies. Results land in ci-out (smoke.log, latest.log).
      - name: Smoke test
        if: steps.build.outputs.status == '0' && hashFiles('ci/smoketest') != ''
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          mkdir -p ci-out
          xvfb-run -a -s "-screen 0 1280x720x24" glxinfo -B > ci-out/glxinfo.txt 2>&1 || true
          set +e
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Psmoketest --console=plain > ci-out/smoke.log 2>&1
          echo "exit=$?" >> ci-out/smoke.log
          cp run/logs/latest.log ci-out/ 2>/dev/null
          cp run/logs/debug.log ci-out/ 2>/dev/null
          cp -r run/crash-reports ci-out/ 2>/dev/null
          true

      # Development aid: signatures of the Minecraft / Forge / Embeddium classes listed in
      # ci/javap.txt, so the port can be checked against the real 1.20.1 APIs.
      - name: Signature dump
        if: always()
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ || true
          echo "${{ steps.build.outputs.status }}" > ci-out/status
          echo "${{ github.sha }}" > ci-out/commit
          ./gradlew printCompileClasspath --console=plain -q || true
          if [ -f build/compile-classpath.txt ] && [ -s ci/javap.txt ]; then
            CP=$(cat build/compile-classpath.txt)
            grep -v '^\s*#' ci/javap.txt | grep -v '^\s*$' | while read -r cls; do
              echo "=== $cls" >> ci-out/javap.txt
              javap -p -cp "$CP" "$cls" >> ci-out/javap.txt 2>&1 || true
            done
          fi
          if [ -f build/compile-classpath.txt ] && [ -s ci/list-packages.txt ]; then
            tr ':' '\n' < build/compile-classpath.txt | while read -r jar; do
              [ -f "$jar" ] || continue
              unzip -Z1 "$jar" 2>/dev/null | grep '\.class$' | grep -E "$(grep -v '^\s*$' ci/list-packages.txt | paste -sd'|')" | sed 's/\.class$//; s|/|.|g' >> ci-out/classes.txt || true
            done
          fi
          cp build/libs/*.jar ci-out/ 2>/dev/null || true
          if [ -f ci/want-srg ]; then for f in $(find build -maxdepth 3 -name "*.srg" -o -maxdepth 3 -name "*.tsrg"); do cp "$f" "ci-out/$(echo "$f" | tr / _)"; done; fi

      - name: Publish CI output
        if: always()
        run: |
          cd ci-out
          git init -q -b ci-out
          git config user.name ci
          git config user.email ci@localhost
          git add -A
          git commit -qm "CI output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out

      - name: Publish dev build
        if: steps.build.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-slim' | head -1)
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build "$JAR" --prerelease --title "Development build" \
            --notes "Automatic build of ${{ github.sha }}. Requires Forge 47.3.0+ and Embeddium 0.3.31 on Minecraft 1.20.1."
