name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # Boots the game on a software GPU (Mesa llvmpipe), creates a world, plays ~75 seconds and checks that
      # every mixin applies and Voxy's renderer comes up (src/smoketest).
      - name: Smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          for attempt in 1 2; do
            rm -rf run/logs run/screenshots run/crash-reports run/saves
            timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Psmoketest --console=plain > smoke.log 2>&1 || true
            # Forge's early window sometimes times out on xvfb; that is the runner, not the mod
            grep -q "Timed out trying to setup the Game Window" smoke.log || break
          done
          mkdir -p smoke
          cp smoke.log build.log run/logs/latest.log run/screenshots/*.png smoke/ 2>/dev/null || true
          cp -r run/crash-reports smoke/ 2>/dev/null || true
          grep "VOXY_SMOKE" run/logs/latest.log || true
          if grep -q "Mixin apply failed" run/logs/latest.log; then echo "::error::A mixin failed to apply"; exit 1; fi
          if grep -q "Missing metadata in pack mod:voxy\|VOXY_SMOKE loading screen modLoadWarnings = \[[^]]" run/logs/latest.log; then echo "::error::Forge reported a mod loading warning"; exit 1; fi
          grep -q "VOXY_SMOKE final .*renderSystem=true" run/logs/latest.log || { echo "::error::Voxy did not start"; exit 1; }
          grep -q "VOXY_SMOKE_RESULT done" run/logs/latest.log || { echo "::error::Smoke test did not finish"; exit 1; }

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-noshaders
          path: smoke/
          if-no-files-found: ignore

  # The shader packs the modpack uses, each rebuilt with Voxy support (shaderpack/packs, ci/build-pack.sh)
  # and run with the modpack's own preset
  shaders:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: photon, pack: photon, preset: preset.txt }
          - { name: photon-cinematic, pack: photon, preset: preset-cinematic.txt, extra: -Pnocolour }
          - { name: photon-ultra, pack: photon, preset: preset-ultra.txt, extra: -Pnocolour }
          - { name: photon-opt, pack: photon-opt, preset: preset.txt, extra: -Pnocolour }
          - { name: complementary, pack: complementary, preset: preset.txt }
          - { name: complementary-opt, pack: complementary, preset: preset-opt.txt, extra: -Pnocolour }
          - { name: derivative, pack: derivative, preset: preset.txt, extra: -Pnocolour }
          - { name: bliss, pack: bliss, preset: preset.txt }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Shader smoke test
        run: |
          chmod +x gradlew ci/build-pack.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          out=out-${{ matrix.name }}
          mkdir -p $out run/shaderpacks run/config
          set +e
          ci/build-pack.sh ${{ matrix.pack }} run/shaderpacks/${{ matrix.pack }}_voxy.zip > $out/pack.txt 2>&1; rc=$?
          set -e
          cat $out/pack.txt
          # Packs that are not published anywhere the runner can fetch them (Derivative) are only checked offline
          if [ $rc = 2 ]; then echo "::warning::Original ${{ matrix.pack }} pack not available to CI, skipped"; exit 0; fi
          [ $rc = 0 ] || exit $rc
          cp shaderpack/packs/${{ matrix.pack }}/${{ matrix.preset }} run/shaderpacks/${{ matrix.pack }}_voxy.zip.txt
          printf 'enableShaders=true\nshaderPack=%s\n' "${{ matrix.pack }}_voxy.zip" > run/config/oculus.properties
          for attempt in 1 2; do
            rm -rf run/logs run/screenshots run/crash-reports run/saves run/patched_shaders
            timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Psmoketest -PwithOculus ${{ matrix.extra }} --console=plain > $out/smoke.log 2>&1 || true
            grep -q "Timed out trying to setup the Game Window" $out/smoke.log || break
          done
          cp run/logs/latest.log run/screenshots/*.png $out/ 2>/dev/null || true
          cp -r run/crash-reports $out/ 2>/dev/null || true
          grep "VOXY_SMOKE\|Voxy render system created\|Creating voxy iris\|could not be found\|Did not find all\|Failed to compile\|error:" run/logs/latest.log | head -80 || true
          if grep -q "Mixin apply failed" run/logs/latest.log; then echo "::error::A mixin failed to apply"; exit 1; fi
          grep -q "VOXY_SMOKE_RESULT done" run/logs/latest.log || { echo "::error::Shader smoke test did not finish"; exit 1; }
          grep -q "using pipeline 'IrisVoxyRenderPipeline'" run/logs/latest.log || { echo "::error::Voxy shader pipeline was not used"; exit 1; }
          if grep -q "Failed to compile shader patch" run/logs/latest.log; then echo "::error::The pack's Voxy shader did not compile"; exit 1; fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.name }}
          path: out-${{ matrix.name }}/
          if-no-files-found: ignore

  publish:
    needs: [build, shaders]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Logs for development: build.log and the smoke test output on the ci-out branch
      - name: Publish CI logs
        run: |
          mkdir -p ci-out
          cp -r artifacts/out-noshaders/. ci-out/ 2>/dev/null || true
          for d in artifacts/out-*; do n=${d#artifacts/out-}; [ "$n" = noshaders ] && continue; mkdir -p ci-out/shaders-$n; cp -r $d/. ci-out/shaders-$n/; done
          find ci-out -name '*.log' -size +20M -exec truncate -s 20M {} \;
          echo "${{ github.sha }}" > ci-out/commit
          echo "build=${{ needs.build.result }} shaders=${{ needs.shaders.result }}" > ci-out/status
          cd ci-out
          git init -q -b ci-out
          git config user.name ci
          git config user.email ci@localhost
          git add -A
          git commit -qm "CI output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out

      - name: Publish release
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          TAG="v${VERSION}-forge-1.20.1"
          JAR=$(ls artifacts/jar/*.jar | grep -v -- '-slim' | head -1)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Voxy ${VERSION} for Forge 1.20.1 + Embeddium" \
            --notes "Build of ${GITHUB_SHA}. Requires Minecraft 1.20.1, Forge 47.1+ and Embeddium 0.3.x. See the README for details."
