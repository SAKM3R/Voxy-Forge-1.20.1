name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log

      # Boots the game on a software GPU (Mesa llvmpipe), creates a world, plays ~75 seconds and checks that
      # every mixin applies and Voxy's renderer comes up (src/smoketest).
      - name: Smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Psmoketest --console=plain > smoke.log 2>&1 || true
          mkdir -p smoke
          cp smoke.log run/logs/latest.log run/screenshots/*.png smoke/ 2>/dev/null || true
          cp -r run/crash-reports smoke/ 2>/dev/null || true
          grep "VOXY_SMOKE" run/logs/latest.log || true
          if grep -q "Mixin apply failed" run/logs/latest.log; then echo "::error::A mixin failed to apply"; exit 1; fi
          if grep -q "Missing metadata in pack mod:voxy\|VOXY_SMOKE loading screen modLoadWarnings = \[[^]]" run/logs/latest.log; then echo "::error::Forge reported a mod loading warning"; exit 1; fi
          grep -q "VOXY_SMOKE final .*renderSystem=true" run/logs/latest.log || { echo "::error::Voxy did not start"; exit 1; }
          grep -q "VOXY_SMOKE_RESULT done" run/logs/latest.log || { echo "::error::Smoke test did not finish"; exit 1; }

      # Same, with Oculus and a shader pack that supports Voxy (voxy.json)
      - name: Shader smoke test
        run: |
          export LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=4.6 MESA_GLSL_VERSION_OVERRIDE=460
          mkdir -p smoke-shaders run/shaderpacks run/config
          rm -rf run/logs run/screenshots run/crash-reports run/saves
          for p in complementary-reimagined complementary-unbound photon-shader solas-shader; do
            url=$(curl -s "https://api.modrinth.com/v2/project/$p/version" | jq -r '[.[] | select(.loaders | index("iris"))][0].files[0].url')
            [ "$url" = "null" ] || [ -z "$url" ] && continue
            f="run/shaderpacks/$(basename "$url" | sed 's/%2B/+/g')"
            curl -sL -o "$f" "$url"
            echo "$p $(basename "$f"): $(unzip -l "$f" | grep -c 'voxy.json') voxy.json" | tee -a smoke-shaders/packs.txt
          done
          PACK=$(for f in run/shaderpacks/*.zip; do unzip -l "$f" | grep -q 'voxy.json' && { basename "$f"; break; }; done)
          echo "Using shader pack: $PACK" | tee -a smoke-shaders/packs.txt
          if [ -n "$PACK" ]; then
            printf 'enableShaders=true\nshaderPack=%s\n' "$PACK" > run/config/oculus.properties
            timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient -Psmoketest -PwithOculus --console=plain > smoke-shaders/smoke.log 2>&1 || true
            cp run/logs/latest.log run/screenshots/*.png smoke-shaders/ 2>/dev/null || true
            cp -r run/crash-reports smoke-shaders/ 2>/dev/null || true
            grep "VOXY_SMOKE\|Voxy render system created\|Creating voxy iris" run/logs/latest.log || true
            if grep -q "Mixin apply failed" run/logs/latest.log; then echo "::error::A mixin failed to apply"; exit 1; fi
            grep -q "VOXY_SMOKE_RESULT done" run/logs/latest.log || { echo "::error::Shader smoke test did not finish"; exit 1; }
            grep -q "using pipeline 'IrisVoxyRenderPipeline'" run/logs/latest.log || { echo "::error::Voxy shader pipeline was not used"; exit 1; }
          fi

      # Logs for development: build.log and the smoke test output on the ci-out branch
      - name: Publish CI logs
        if: always()
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ 2>/dev/null || true
          cp -r smoke/. ci-out/ 2>/dev/null || true
          mkdir -p ci-out/shaders && cp -r smoke-shaders/. ci-out/shaders/ 2>/dev/null || true
          echo "${{ github.sha }}" > ci-out/commit
          echo "${{ job.status }}" > ci-out/status
          cd ci-out
          git init -q -b ci-out
          git config user.name ci
          git config user.email ci@localhost
          git add -A
          git commit -qm "CI output for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-out

      - name: Upload smoke test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke/
          if-no-files-found: ignore

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          TAG="v${VERSION}-forge-1.20.1"
          JAR=$(ls build/libs/*.jar | grep -v -- '-slim' | head -1)
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release delete dev-build --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "Voxy ${VERSION} for Forge 1.20.1 + Embeddium" \
            --notes "Build of ${GITHUB_SHA}. Requires Minecraft 1.20.1, Forge 47.1+ and Embeddium 0.3.x. See the README for details."
